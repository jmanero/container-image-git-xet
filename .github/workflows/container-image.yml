---
name: Build and Push Container Image
on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md' # Don't trigger builds for documentation changes
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read
  packages: write

env:
  major_version: "1"
  minor_version: "0.0"
  platforms: linux/amd64,linux/arm64

jobs:
  build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        id: launch_builder

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          TIMESTAMP=$(date --utc +%Y-%m-%dT%H%M%S)

          docker buildx use ${{ steps.launch_builder.outputs.name }}
          docker buildx build --push --pull\
            --platform ${{ env.platforms }}\
            --label "org.label-schema.vcs-ref=${{ github.sha }}"\
            --label "org.label-schema.version=${{ env.major_version }}.${{ env.minor_version }}"\
            --tag ghcr.io/jmanero/git-xet:latest\
            --tag ghcr.io/jmanero/git-xet:${{ env.major_version }}\
            --tag ghcr.io/jmanero/git-xet:${{ env.major_version }}.${{ env.minor_version }}\
            --tag ghcr.io/jmanero/git-xet:${{ env.major_version }}.${{ env.minor_version }}-${{ github.sha }}\
            --file Containerfile .
